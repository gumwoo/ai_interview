spring:
  application:
    name: ai-interview
  datasource:
    # 접속 정보는 SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD 환경 변수로 받는다.
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# API 토큰은 APP_API_TOKEN 환경 변수로 받는다. 없으면 기동에 실패한다.
app:
  interview:
    max-daily-sessions: ${MAX_DAILY_SESSIONS:2}
    max-session-turns: ${MAX_SESSION_TURNS:30}
    # 한 개념을 이어서 묻는 횟수. 넘으면 다음 질문으로 간다.
    max-follow-up-depth: 2
  claude:
    # 없으면 기동에 실패한다.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${CLAUDE_MODEL:claude-sonnet-5-5}
    # 모델마다 기본값이 다르므로 직접 지정한다.
    # 환경 변수 CLAUDE_EFFORT는 Claude Code가 자체로 쓰므로 다른 이름을 쓴다.
    effort: ${INTERVIEW_LLM_EFFORT:medium}
    # SDK는 타임아웃도 재시도하므로 최대 대기는 timeout x (max-retries + 1)이다. 앱 타임아웃은 이보다 길게 잡는다.
    # 실제 호출에서 질문 생성이 14초 걸린 적이 있어 여유를 둔다.
    timeout: 30s
    max-retries: 2
    max-output-tokens: 4000
    daily-input-token-limit: ${MAX_DAILY_INPUT_TOKENS:300000}
    daily-output-token-limit: ${MAX_DAILY_OUTPUT_TOKENS:100000}
    # 1M 토큰당 USD. 2026-10-06 기준 문서 값이며, 사용량 추산에만 쓴다.
    pricing:
      claude-haiku-5-5:
        input-per-million: 0.10
        output-per-million: 0.50
      claude-sonnet-5-5:
        input-per-million: 2.00
        output-per-million: 10.00
